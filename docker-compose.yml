services:
  ministack:
    image: nahuelnucera/ministack
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_ministack/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  init-aws:
    image: amazon/aws-cli:latest
    depends_on:
      ministack:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: /bin/sh
    command:
      - -c
      - |
        # Create S3 bucket for yard state
        aws --endpoint-url=http://ministack:4566 s3 mb s3://yard-state

        echo "--- ministack resources created ---"
        aws --endpoint-url=http://ministack:4566 s3 ls
