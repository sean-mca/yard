services:
  ministack:
    image: nahuelnucera/ministack
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_ministack/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  init-aws:
    image: amazon/aws-cli:latest
    depends_on:
      ministack:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: /bin/sh
    command:
      - -c
      - |
        # Create S3 bucket for yard state
        aws --endpoint-url=http://ministack:4566 s3 mb s3://yard-state

        # Create DynamoDB table (single-table design)
        aws --endpoint-url=http://ministack:4566 dynamodb create-table \
          --table-name yard_yard \
          --attribute-definitions \
            AttributeName=PK,AttributeType=S \
            AttributeName=SK,AttributeType=S \
            AttributeName=GSI1PK,AttributeType=S \
            AttributeName=GSI1SK,AttributeType=S \
          --key-schema \
            AttributeName=PK,KeyType=HASH \
            AttributeName=SK,KeyType=RANGE \
          --global-secondary-indexes \
            '[{
              "IndexName": "GSI1",
              "KeySchema": [
                {"AttributeName": "GSI1PK", "KeyType": "HASH"},
                {"AttributeName": "GSI1SK", "KeyType": "RANGE"}
              ],
              "Projection": {"ProjectionType": "ALL"}
            }]' \
          --billing-mode PAY_PER_REQUEST

        echo "--- ministack resources created ---"
        aws --endpoint-url=http://ministack:4566 s3 ls
        aws --endpoint-url=http://ministack:4566 dynamodb list-tables
