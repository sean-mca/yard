# acme-glue-etl example project — single Glue job demonstrating
# the source -> transform -> sink pattern. See README.md for
# what to change before applying to your own AWS account.
project: acme-glue-etl

state:
  type: local
  path: .yard/state

# Which plugin runs `type: glue` jobs. The source is the plugin's GitHub
# repository: yard downloads the v0.1.0 release asset for whatever platform it
# runs on. A git URL (git::...) builds from source; a file:// path uses a
# local binary. Every glue job inherits this pin unless it sets its own.
plugins:
  glue:
    version: "0.1.0"
    source: "https://github.com/your-org/yard-plugin-glue"

providers:
  glue:
    script_bucket: acme-analytics-prod-glue-scripts
    script_prefix: yard-scripts/
    region: us-east-1
    glue_version: "4.0"
    worker_type: G.1X
    number_of_workers: 2
