type: glue
plugin_version: "0.1.0"
# NOTE: the URL is written out in full. Placeholder templating is not usable
# in a job file today -- see the "Known limitation" note in
# docs/reference/migrations/v2.0.md.
plugin_source: "https://github.com/your-org/yard-plugin-glue/releases/download/v0.1.0/yard-plugin-glue-0.1.0-aarch64-macos"
role: arn:aws:iam::123456789012:role/acme-yard-glue-job

sources:
  - name: orders
    type: s3
    path: s3://acme-analytics-prod-raw/orders/
    format: parquet

transforms:
  - type: sql
    source: orders
    output: orders_projected
    query: "SELECT order_id, customer_id, order_total_cents, status, created_at FROM orders WHERE order_total_cents > 0"
  - type: filter
    source: orders_projected
    output: paid_orders
    condition: F.col("status") == "paid"
  - type: drop_columns
    source: paid_orders
    output: paid_orders_clean
    columns:
      - status

sink:
  source: paid_orders_clean
  type: s3
  path: s3://acme-analytics-prod-clean/orders/
  format: parquet
  mode: overwrite
