type: glue
role: arn:aws:iam::123456789012:role/acme-yard-glue-job

sources:
  - name: raw_orders
    type: s3
    path: s3://acme-analytics-prod-raw/orders/
    format: parquet

transforms:
  - type: filter
    source: raw_orders
    output: clean_orders
    condition: F.col("status") == "paid"

sink:
  source: clean_orders
  type: s3
  path: s3://acme-analytics-prod-clean/orders/
  format: parquet
  mode: overwrite
